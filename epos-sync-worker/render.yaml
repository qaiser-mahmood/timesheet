services:
  - type: web
    name: epos-sync-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: epos-sync-worker
    plan: free
    region: singapore
    envVars:
      - key: EPOS_USERNAME
        sync: false
      - key: EPOS_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTHORIZED_MANAGERS
        sync: false
      - key: PORT
        value: 3000
      - key: TZ
        value: Australia/Perth

